global:
  scrape_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: black-ice-ingest
    static_configs:
      - targets: ["ingest:9100"]
  - job_name: black-ice-detect
    static_configs:
      - targets: ["detect:9100"]
  - job_name: black-ice-embed
    static_configs:
      - targets: ["embed:9100"]
  - job_name: black-ice-match
    metrics_path: /metrics
    static_configs:
      - targets: ["match:8000"]
  - job_name: black-ice-drift
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
