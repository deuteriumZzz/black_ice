{{- range .Values.ingest.cameras }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: black-ice-ingest-{{ .id }}
  labels:
    {{- include "black-ice.componentLabels" (dict "component" "ingest" "Release" $.Release) | nindent 4 }}
    camera-id: {{ .id }}
spec:
  # One pod per camera (spec 3.1: CPU-bound video decode is a process/pod unit of
  # scale, not a thread) — never set replicas > 1 here, add more entries under
  # ingest.cameras instead.
  replicas: 1
  selector:
    matchLabels:
      app: black-ice-ingest-{{ .id }}
  template:
    metadata:
      labels:
        app: black-ice-ingest-{{ .id }}
        {{- include "black-ice.componentLabels" (dict "component" "ingest" "Release" $.Release) | nindent 8 }}
    spec:
      containers:
        - name: ingest
          image: {{ include "black-ice.image" (dict "component" "ingest" "Values" $.Values) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: black-ice-config }
          env:
            - name: CAMERA_ID
              value: {{ .id | quote }}
            - name: SOURCE
              value: {{ .source | quote }}
            - name: INGEST_FPS
              value: {{ .fps | quote }}
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            {{- toYaml $.Values.ingest.resources | nindent 12 }}
---
{{- end }}
