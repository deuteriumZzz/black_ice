{{- if not .Values.vault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: black-ice-secrets
  labels:
    {{- include "black-ice.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.connections.databaseUrl | quote }}
  # ingestApiKey is folded into the same seeded key list, role "ingest" (see
  # rbac.ROLES) — one source of truth for the value, since it also has to
  # match what INGEST_API_KEY below hands to ingest pods.
  BLACK_ICE_API_KEYS: {{ printf "%s,%s:ingest" .Values.apiKeys .Values.ingestApiKey | quote }}
  INGEST_API_KEY: {{ .Values.ingestApiKey | quote }}
  {{- if .Values.templateProtection.enabled }}
  TEMPLATE_PROTECTION_SEED: {{ .Values.templateProtection.seed | quote }}
  {{- end }}
{{- end }}
{{/*
When vault.enabled, this chart renders no black-ice-secrets object at all —
DATABASE_URL/BLACK_ICE_API_KEYS live only in Vault (see values.yaml's vault.*
comment) and VAULT_TOKEN comes from vaultTokenSecretRef, an externally-managed
Secret this chart does not create.
*/}}
