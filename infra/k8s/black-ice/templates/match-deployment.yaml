apiVersion: apps/v1
kind: Deployment
metadata:
  name: black-ice-match
  labels:
    {{- include "black-ice.componentLabels" (dict "component" "match" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.match.replicas }}
  selector:
    matchLabels: { app: black-ice-match }
  template:
    metadata:
      labels:
        app: black-ice-match
        {{- include "black-ice.componentLabels" (dict "component" "match" "Release" .Release) | nindent 8 }}
    spec:
      {{- if eq .Values.orchestratorBackend "kubernetes" }}
      serviceAccountName: black-ice-match
      {{- end }}
      containers:
        - name: match
          image: {{ include "black-ice.image" (dict "component" "match" "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: black-ice-config }
            {{- include "black-ice.secretsEnvFrom" . | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.match.resources | nindent 12 }}
