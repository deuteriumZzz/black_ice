# Stateful dependencies (Kafka/Redpanda, Qdrant, Postgres) are NOT bundled in this
# chart — install them via their own official charts (or point at managed services)
# and just fill in the connection strings below. Bundling stateful infra into an
# app chart is exactly the coupling that makes upgrades and backups painful.
image:
  registry: ghcr.io/example/black-ice  # replace with your registry
  tag: latest
  pullPolicy: IfNotPresent

connections:
  kafkaBootstrapServers: "redpanda.kafka.svc.cluster.local:9092"
  qdrantUrl: "http://qdrant.qdrant.svc.cluster.local:6333"
  databaseUrl: "postgresql+psycopg2://black_ice:black_ice@postgres.postgres.svc.cluster.local:5432/black_ice"
  otelExporterOtlpEndpoint: "http://jaeger-collector.observability.svc.cluster.local:4317"

matchThreshold: "0.45"
retentionDays: "90"

# Shadow-mode candidate model evaluation — off by default, zero overhead when off.
# See libs/black_ice_common/embedding.py and services/match/app/shadow_consumer.py.
shadowEmbedding:
  enabled: false
  pack: "buffalo_s"

apiKeys: "change-me-admin:admin,change-me-operator:operator"  # -> Secret; override per-environment

# Real IdP (libs/black_ice_common/oidc.py), opt-in. When "oidc", match
# validates a Bearer JWT against issuerUrl instead of X-API-Key/apiKeys
# above — apiKeys stays rendered either way (switching back needs no
# redeploy of secrets). issuerUrl is what tokens must carry as `iss` and is
# what match uses for discovery too, UNLESS discoveryUrl is set — only
# needed when match and the SPA reach the IdP via different hostnames
# (there usually is just one real public hostname in production, reachable
# by both — see infra/docker-compose.yml's keycloak service for why local
# compose needs the split).
auth:
  backend: "api_key"  # "api_key" | "oidc"
  oidc:
    issuerUrl: "https://idp.example.com/realms/black-ice"
    discoveryUrl: ""  # "" = same as issuerUrl

# Vault-backed secrets (libs/black_ice_common/secrets.py), opt-in. When enabled,
# this chart stops rendering databaseUrl/apiKeys into a plaintext K8s Secret —
# the app reads them from Vault's KV v2 API at startup instead. vaultTokenSecretRef
# names an EXTERNAL Secret (created by your Vault auth integration — e.g. the
# Vault Agent Injector or External Secrets Operator, not this chart) holding a
# short-lived VAULT_TOKEN; this chart deliberately does not mint or store that
# token itself, since a static long-lived token baked into values.yaml would
# just move the plaintext-secret problem, not solve it.
vault:
  enabled: false
  addr: "http://vault.vault.svc.cluster.local:8200"
  kvPath: "secret/data/black-ice"
  vaultTokenSecretRef: "vault-token"  # must have a VAULT_TOKEN key

# Ingest orchestration (STATUS.md gap): "none" keeps the static ingest.cameras
# list below as the only way to deploy an ingest pod. "kubernetes" additionally
# lets match create/delete one Deployment per camera at runtime as cameras are
# registered via the API/admin-ui (see libs/black_ice_common/ingest_orchestrator.py)
# — grants match's ServiceAccount deployments RBAC (ingest-orchestrator-rbac.yaml)
# only when this is "kubernetes", least-privilege by default.
orchestratorBackend: "none"  # "none" | "kubernetes" ("docker" only applies to local compose)

ingest:
  cameras:
    - id: cam-0
      source: demo
      fps: "5"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

detect:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

embed:
  replicas: 2
  gpu:
    enabled: false  # set true + resources.limits["nvidia.com/gpu"]: 1 on a GPU node pool
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

match:
  replicas: 2
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

retentionCronJob:
  enabled: true
  schedule: "0 3 * * *"  # daily at 03:00

driftMonitorCronJob:
  enabled: true
  schedule: "0 * * * *"  # hourly
  pushgatewayUrl: "http://pushgateway.observability.svc.cluster.local:9091"

cameraOfflineCronJob:
  enabled: true
  schedule: "*/5 * * * *"  # every 5 minutes — cheap DB scan, catches an offline camera fast

# HA/DR (STATUS.md gap): scripts/backup_{postgres,qdrant}.py, writing to a PVC
# so backups outlive the pod that made them. This complements, not replaces,
# clustered HA for Postgres/Qdrant themselves (see README's HA/DR section) —
# this chart deliberately doesn't bundle stateful infra, so real replication
# comes from your Postgres/Qdrant operator, not from this CronJob.
backupCronJob:
  enabled: true
  schedule: "0 3 * * *"  # daily at 03:00
  storageClassName: ""  # "" = cluster default
  storageSize: "10Gi"
