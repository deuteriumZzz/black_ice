x-python-env: &python-env
  PYTHONUNBUFFERED: "1"
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  QDRANT_URL: http://qdrant:6333
  DATABASE_URL: postgresql+psycopg2://black_ice:black_ice@postgres:5432/black_ice
  MATCH_THRESHOLD: "0.45"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  # Shadow-mode candidate model evaluation — off by default, zero overhead.
  # Flip to "true" to also run buffalo_s (see embedding.py) against a separate
  # gallery on every enroll/frame and compare via scripts/shadow_report.py.
  SHADOW_EMBEDDING_ENABLED: "false"
  # Where ingest fetches its camera config from (skipped when SOURCE=demo).
  MATCH_API_URL: http://match:8000

services:
  # --- infra ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    # Kafka-protocol compatible, single binary (no Zookeeper) — same client code
    # (confluent-kafka) as a real Kafka cluster; swap the bootstrap server in prod.
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    # pg_dump/pg_restore in the match image (services/match/Dockerfile) come
    # from Debian's default postgresql-client package, which floats to
    # whatever major version Debian currently ships (17 as of this comment) —
    # pg_restore rejects session-level GUCs from a newer major (real bug found
    # via live HA/DR testing: "unrecognized configuration parameter
    # transaction_timeout" restoring a v17 dump into a v16 server). Keeping
    # this in sync with that client's major version avoids it outright,
    # instead of pinning a specific postgresql-client-<N> via an extra PGDG
    # apt repo in the Dockerfile.
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=black_ice
      - POSTGRES_PASSWORD=black_ice
      - POSTGRES_DB=black_ice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- pipeline ---
  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    environment:
      <<: *python-env
      CAMERA_ID: cam-0
      SOURCE: demo
      INGEST_FPS: "5"
    depends_on:
      - redpanda

  detect:
    build:
      context: ..
      dockerfile: services/detect/Dockerfile
    environment: *python-env
    depends_on:
      - redpanda
    volumes:
      - insightface_models:/root/.insightface
    # Horizontal scale-out unit (spec 3.1: pods, not threads):
    # docker compose up --scale detect=3

  embed:
    build:
      context: ..
      dockerfile: services/embed/Dockerfile
    environment: *python-env
    depends_on:
      - redpanda
    volumes:
      - insightface_models:/root/.insightface

  match:
    build:
      context: ..
      dockerfile: services/match/Dockerfile
    environment:
      <<: *python-env
      BLACK_ICE_API_KEYS: "dev-admin-key:admin,dev-operator-key:operator"
    ports:
      - "8000:8000"
    depends_on:
      - redpanda
      - qdrant
      - postgres
    volumes:
      - insightface_models:/root/.insightface
      # Only used when ORCHESTRATOR_BACKEND=docker is set (via .env, opt-in —
      # default is "none"). Mounting the host's Docker socket into match lets
      # it deploy/remove one ingest container per camera; ingest_image
      # defaults to this compose project's own "infra-ingest:latest" tag.
      - /var/run/docker.sock:/var/run/docker.sock

  ui:
    image: python:3.11-slim
    working_dir: /ui
    volumes:
      - ../ui:/ui
    command: ["python", "-m", "http.server", "8080"]
    ports:
      - "8080:8080"

  admin-ui:
    build:
      context: ../admin-ui
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - match

  # --- observability (docker compose --profile observability up) ---
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ../observability/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["observability"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI
      - "4317:4317"  # OTLP gRPC

  pushgateway:
    # Ephemeral batch jobs (scripts/drift_report.py) don't live long enough for
    # Prometheus to scrape them directly — they push here instead.
    image: prom/pushgateway:v1.9.0
    profiles: ["observability"]
    ports:
      - "9091:9091"

  # --- secrets (docker compose --profile secrets up vault) ---
  vault:
    # Dev-mode server: unsealed, in-memory, fixed root token — for exercising
    # libs/black_ice_common/secrets.py locally, not a production Vault setup.
    # A real deployment runs a proper Vault cluster and gives match/ingest a
    # scoped token (e.g. via the Vault K8s auth method), not this root token.
    image: hashicorp/vault:1.18
    profiles: ["secrets"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-vault-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  # --- real IdP (docker compose --profile idp up keycloak) ---
  keycloak:
    # Dev-mode server (start-dev: in-memory H2, not for production) that
    # auto-imports infra/keycloak/realm-export.json on boot — a "black-ice"
    # realm with admin/operator/viewer roles, a public SPA client
    # (black-ice-admin-ui, PKCE required) and three seeded dev users, so
    # `docker compose --profile idp up keycloak` is immediately usable
    # without any manual admin-console clicking.
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["idp"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Fixed (not request-reflected) so every token's `iss` is the same
      # value regardless of whether it was reached via this published port
      # (the browser's only option) or the compose-internal "keycloak:8080"
      # (what match uses — see oidc.py's oidc_discovery_url split for why).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"

# To point match at Keycloak instead of static API keys, add to .env:
#   AUTH_BACKEND=oidc
#   OIDC_ISSUER_URL=http://localhost:8180/realms/black-ice
#   OIDC_DISCOVERY_URL=http://keycloak:8080/realms/black-ice
# (two different hostnames on purpose — see oidc.py's module docstring)

# One-off maintenance jobs reuse the `match` service's image (it already has
# scripts/ + every dependency they need) — override its command, don't add it to
# `up`:
#   docker compose run --rm match python scripts/reindex_faces.py --m 32 --ef-construct 200
#   docker compose run --rm match python scripts/drift_report.py --pushgateway-url http://pushgateway:9091
#   docker compose run --rm match python scripts/shadow_report.py --model-version buffalo_s

volumes:
  qdrant_data:
  postgres_data:
  insightface_models:
